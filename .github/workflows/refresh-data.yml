name: 每日刷新议题数据

# 只负责抓取新数据并提交回仓库；提交推送后 Vercel 会自动重新构建部署。
# 如果不想用 GitHub Actions 自动更新，可以删掉这个文件，改成本地跑 node scripts/fetch.mjs。
on:
  schedule:
    # 每天 22:10 UTC = 次日 06:10 香港时间
    - cron: '10 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取最新议题
        run: node scripts/fetch.mjs --verbose

      - name: 数据有变化就提交（推送后 Vercel 自动重新部署）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "数据没有变化，跳过提交。"
          else
            git commit -m "chore(data): $(date -u +%F) 自动抓取"
            git push
          fi
